[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tacdex13"
version = "0.1.0"
description = "Independent TactSpace-inspired single-ID3 sim-to-real research implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2"]

[project.optional-dependencies]
sim = ["mujoco==4.0.0"]
io = ["h5py>=3.10"]
dev = ["pytest>=8"]

[project.scripts]
tacdex = "tacdex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
